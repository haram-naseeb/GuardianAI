# nginx config for the Guardian AI SPA.
# Serves the static build and proxies /api to the backend container so the
# frontend keeps calling same-origin /api (no CORS, matches the dev proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend service (docker-compose service name "backend")
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side state machine handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
